name: Windows browser regression

on:
  push:
    branches:
      - arena/01a07ff9-khyeastwebsite

permissions:
  contents: write

jobs:
  refresh-reviewed-baselines:
    if: "!contains(github.event.head_commit.message, '[skip windows-e2e]')"
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium

      # One-time finalisation after the screenshots were reviewed. `all` is
      # deliberate: the normal 1.5% tolerance can consider a newly revealed
      # heading a pass and therefore leave the old hidden-heading PNG intact.
      - run: npx playwright test e2e/visual.spec.js --project=desktop --update-snapshots=all

      - name: Commit the reviewed finished-state screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.js-snapshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "test: refresh reviewed Windows baselines [skip windows-e2e]"
            git push origin HEAD:arena/01a07ff9-khyeastwebsite
          }
