name: Windows browser regression

on:
  push:
    branches:
      - arena/01a07ff9-khyeastwebsite

permissions:
  actions: read
  contents: write

jobs:
  retrieve-account-trace:
    if: "!contains(github.event.head_commit.message, '[skip windows-e2e]')"
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download the complete-run diagnostics
        uses: actions/download-artifact@v4
        with:
          name: windows-browser-review
          path: windows-review
          run-id: 39108329186
          github-token: ${{ github.token }}

      - name: Publish only the failing mobile account trace
        shell: pwsh
        run: |
          $destination = '.ci/windows-account-artifact'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $matches = Get-ChildItem windows-review -Directory -Recurse |
            Where-Object { $_.Name -like 'account-customer-accounts-*mobile-mobile*' }
          if (-not $matches) {
            throw 'The account failure directory was not present in the downloaded artifact.'
          }
          foreach ($match in $matches) {
            Copy-Item $match.FullName (Join-Path $destination $match.Name) -Recurse
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $destination
          git commit -m "test: publish mobile account trace [skip windows-e2e]"
          git push origin HEAD:arena/01a07ff9-khyeastwebsite
