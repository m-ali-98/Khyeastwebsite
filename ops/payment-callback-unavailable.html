<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <meta name="robots" content="noindex,nofollow">
  <title>در حال بررسی پرداخت</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f7f5; color: #171717; padding: 24px; }
    main { width: min(100%, 560px); background: #fff; border: 1px solid #e7e3df; border-top: 4px solid #a80d28; border-radius: 18px; padding: 32px; box-shadow: 0 18px 50px rgba(0,0,0,.08); }
    h1 { margin: 0 0 14px; font-size: clamp(22px,5vw,30px); }
    p { margin: 10px 0; line-height: 1.9; }
    strong { color: #8e0b22; }
    small { display: block; margin-top: 20px; color: #65605c; }
  </style>
</head>
<body>
  <main>
    <h1>در حال بررسی نتیجه پرداخت</h1>
    <p>ارتباط با سامانه فروش برای چند لحظه در دسترس نیست. همین صفحه هر پنج ثانیه دوباره نتیجه را بررسی می‌کند.</p>
    <p><strong>لطفاً دوباره پرداخت نکنید و این صفحه را نبندید.</strong></p>
    <small>اگر وضعیت پس از چند دقیقه مشخص نشد، اطلاعات سفارش را برای پشتیبانی نگه دارید.</small>
  </main>
</body>
</html>
