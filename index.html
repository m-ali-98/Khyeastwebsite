<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dc143c" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />

    <!-- Slow connections: start the two critical fetches before the JS bundle
         has even been parsed, and paint a branded screen instead of white. -->
    <link rel="preload" as="fetch" href="/api/content" crossorigin />
    <link rel="preload" as="image" href="/assets/img/hero-wheat.webp" fetchpriority="high" />
    <title>شرکت خمیر مایه خوزستان | از مغز گندم؛ تا اولین برش نان</title>
    <meta
      name="description"
      content="شرکت خمیر مایه خوزستان؛ تولیدکننده خمیرمایه خشک فوری با برندهای دزمایه، شتاب، ایکس پاور و نان مایه. بیش از سه دهه تجربه، صادرات به بیش از ۵۰ کشور جهان. از مغز گندم؛ تا اولین برش نان."
    />
    <meta property="og:title" content="شرکت خمیر مایه خوزستان" />
    <meta property="og:description" content="از مغز گندم؛ تا اولین برش نان — تولیدکننده خمیرمایه خشک فوری با بیش از سه دهه سابقه و صادرات به بیش از ۵۰ کشور" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <style>
      /* Critical inline CSS — renders before the stylesheet arrives */
      html { background: #fbf6f5; }
      body { margin: 0; font-family: 'Vazirmatn Variable', 'Vazirmatn', Tahoma, sans-serif; }
      #boot-splash {
        --boot-bg: #fbf6f5;
        --boot-surface: rgba(255, 255, 255, .86);
        --boot-line: rgba(84, 53, 62, .13);
        --boot-accent: #dc143c;
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 44%, rgba(220, 20, 60, .1), transparent 34%),
          var(--boot-bg);
        transform: translate3d(0, 0, 0);
        transition: transform .48s cubic-bezier(.76, 0, .24, 1), visibility 0s .5s;
        will-change: transform;
        contain: paint;
      }
      /* One clean sheet moves away after the route commits; the app and loader
         are never cross-faded as two full-screen layers. */
      #boot-splash.is-done {
        transform: translate3d(0, -101%, 0);
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash::before {
        content: '';
        position: absolute;
        width: min(62vw, 620px);
        aspect-ratio: 1;
        border: 1px solid var(--boot-line);
        border-radius: 50%;
        box-shadow:
          0 0 0 84px rgba(220, 20, 60, .022),
          0 0 0 168px rgba(220, 20, 60, .014);
      }
      #boot-splash::after {
        content: '';
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 50%;
        width: 1px;
        height: 15vh;
        min-height: 84px;
        background: linear-gradient(var(--boot-accent), transparent);
        opacity: .3;
      }
      .boot-splash__content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 38px;
        animation: boot-arrive .55s cubic-bezier(.16, 1, .3, 1) both;
      }
      .boot-splash__mark {
        position: relative;
        width: 122px;
        height: 122px;
        display: grid;
        place-items: center;
        border: 1px solid var(--boot-line);
        border-radius: 36px;
        background: var(--boot-surface);
        box-shadow: 0 28px 80px -42px rgba(50, 20, 28, .42);
      }
      .boot-splash__mark::before {
        content: '';
        position: absolute;
        inset: -16px;
        border: 1px solid rgba(220, 20, 60, .22);
        border-radius: 46px;
        animation: boot-ring 1.8s cubic-bezier(.65, 0, .35, 1) infinite alternate;
        will-change: transform, opacity;
      }
      .boot-splash__mark::after {
        content: '';
        position: absolute;
        inset-block-start: -20px;
        inset-inline-end: 17px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--boot-accent);
        animation: boot-pulse 1s ease-in-out infinite alternate;
        will-change: transform, opacity;
      }
      .boot-splash__mark img {
        position: relative;
        z-index: 1;
        width: 76px;
        height: auto;
        display: block;
      }
      .boot-splash__bar {
        width: 168px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-line);
      }
      .boot-splash__bar span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--boot-accent), transparent);
        transform: translate3d(-120%, 0, 0);
        animation: boot-sweep 1.18s cubic-bezier(.65, 0, .35, 1) infinite;
        will-change: transform;
      }
      [dir='rtl'] .boot-splash__bar span {
        margin-left: auto;
        transform: translate3d(120%, 0, 0);
        animation-name: boot-sweep-rtl;
      }
      /* Text remains available to assistive technology, but no copy competes
         with the mark on the visual loading screen. */
      .boot-splash__a11y {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .boot-i18n > [lang] { display: none; }
      html[lang='fa'] .boot-i18n > [lang='fa'],
      html[lang='en'] .boot-i18n > [lang='en'],
      html[lang='ar'] .boot-i18n > [lang='ar'] { display: inline; }
      @keyframes boot-arrive {
        from { opacity: 0; transform: translate3d(0, 12px, 0) scale(.98); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes boot-ring {
        from { opacity: .22; transform: scale(.97); }
        to { opacity: .62; transform: scale(1.025); }
      }
      @keyframes boot-pulse {
        from { opacity: .36; transform: scale(.72); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-sweep {
        from { transform: translate3d(-120%, 0, 0); }
        to { transform: translate3d(365%, 0, 0); }
      }
      @keyframes boot-sweep-rtl {
        from { transform: translate3d(120%, 0, 0); }
        to { transform: translate3d(-365%, 0, 0); }
      }
      html[data-theme='dark'] { background: #120a0d; }
      html[data-theme='dark'] #boot-splash {
        --boot-bg: #120a0d;
        --boot-surface: rgba(35, 22, 26, .86);
        --boot-line: rgba(255, 255, 255, .1);
        --boot-accent: #ef2b52;
      }
      html[data-theme='dark'] .boot-splash__mark {
        box-shadow: 0 28px 84px -42px rgba(0, 0, 0, .86);
      }
      html[data-theme='dark'] .boot-splash__mark img { filter: brightness(0) invert(1); }
      @media (max-width: 520px) {
        #boot-splash::before { width: 112vw; }
        .boot-splash__content { gap: 34px; }
        .boot-splash__mark { width: 108px; height: 108px; border-radius: 32px; }
        .boot-splash__mark::before { border-radius: 41px; }
        .boot-splash__mark img { width: 68px; }
        .boot-splash__bar { width: 148px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        #boot-splash.is-done { transform: none; visibility: hidden; }
        .boot-splash__content,
        .boot-splash__mark::before,
        .boot-splash__mark::after,
        .boot-splash__bar span { animation: none; }
        .boot-splash__bar span { width: 100%; transform: none; }
      }
    </style>

    <!-- Set language, direction and theme before the first paint so the page
         never flashes the wrong script direction or a white screen in dark
         mode. Mirrors the logic in src/i18n/LocaleContext.jsx. -->
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var loc = seg === 'en' || seg === 'ar' ? seg : 'fa';
        var el = document.documentElement;
        el.lang = loc;
        el.dir = loc === 'en' ? 'ltr' : 'rtl';
        var theme;
        try { theme = localStorage.getItem('ky_theme'); } catch (e) {}
        /* First visits always start light. Dark mode is an explicit preference,
           not an automatic copy of the operating-system setting. */
        if (theme !== 'dark' && theme !== 'light') theme = 'light';
        el.setAttribute('data-theme', theme);
        el.style.colorScheme = theme;
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) chrome.setAttribute('content', theme === 'dark' ? '#120a0d' : '#dc143c');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Keep the first-paint splash outside #root: createRoot replaces that
         node's children on its first commit. The resolved route removes this
         sibling only after its own content has painted. -->
    <div
      id="boot-splash"
      class="boot-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-labelledby="boot-live"
    >
      <span class="boot-splash__a11y boot-i18n" id="boot-live">
        <span lang="fa">در حال بارگذاری</span>
        <span lang="en">Loading</span>
        <span lang="ar">جارٍ التحميل</span>
      </span>
      <div class="boot-splash__content" aria-hidden="true">
        <div class="boot-splash__mark">
          <img src="/assets/brand/logo.webp" alt="" width="76" height="73" fetchpriority="high" />
        </div>
        <div class="boot-splash__bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
