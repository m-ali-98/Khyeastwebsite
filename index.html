<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#DC143C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Slow connections: start the two critical fetches before the JS bundle
         has even been parsed, and paint a branded screen instead of white. -->
    <link rel="preload" as="fetch" href="/api/content" crossorigin />
    <link rel="preload" as="image" href="/assets/img/hero-wheat.jpg" fetchpriority="high" />
    <title>شرکت خمیر مایه خوزستان | از مغز گندم؛ تا اولین برش نان</title>
    <meta
      name="description"
      content="شرکت خمیر مایه خوزستان؛ تولیدکننده خمیرمایه خشک فوری با برندهای دزمایه، شتاب، ایکس پاور و نان مایه. بیش از سه دهه تجربه، صادرات به بیش از ۵۰ کشور جهان. از مغز گندم؛ تا اولین برش نان."
    />
    <meta property="og:title" content="شرکت خمیر مایه خوزستان" />
    <meta property="og:description" content="از مغز گندم؛ تا اولین برش نان — تولیدکننده خمیرمایه خشک فوری با بیش از سه دهه سابقه و صادرات به بیش از ۵۰ کشور" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <style>
      /* Critical inline CSS — renders before the stylesheet arrives */
      html { background: #fbf6f5; }
      body { margin: 0; font-family: 'Vazirmatn Variable', 'Vazirmatn', Tahoma, sans-serif; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-content: center;
        justify-items: center; gap: 18px; background: #fbf6f5; z-index: 9999;
      }
      /* the company mark, drawing itself in while the bundle loads */
      .boot-splash__mark { width: 72px; height: auto; overflow: visible; }
      .boot-splash__mark path {
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: boot-draw 1.5s ease-in-out infinite alternate;
      }
      .boot-splash__mark path:nth-child(2) { animation-delay: 0.08s; }
      .boot-splash__mark path:nth-child(3) { animation-delay: 0.16s; }
      .boot-splash__mark path:nth-child(4) { animation-delay: 0.24s; }
      .boot-splash__mark path:nth-child(5) { animation-delay: 0.32s; }
      .boot-splash__mark path:nth-child(6) { animation-delay: 0.40s; }
      .boot-splash__mark path:nth-child(7) { animation-delay: 0.48s; }
      .boot-splash__text { margin: 0; color: #7c6a6e; font-size: 14px; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark path { animation: none; stroke-dashoffset: 0; }
      }
      /* dark splash when dark mode is the active theme */
      html[data-theme='dark'] { background: #120a0d; }
      html[data-theme='dark'] #boot-splash { background: #120a0d; }
      html[data-theme='dark'] .boot-splash__text { color: #9d8e92; }
    </style>

    <!-- Set language, direction and theme before the first paint so the page
         never flashes the wrong script direction or a white screen in dark
         mode. Mirrors the logic in src/i18n/LocaleContext.jsx. -->
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var loc = seg === 'en' || seg === 'ar' ? seg : 'fa';
        var el = document.documentElement;
        el.lang = loc;
        el.dir = loc === 'en' ? 'ltr' : 'rtl';
        var theme;
        try { theme = localStorage.getItem('ky_theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        el.setAttribute('data-theme', theme);
        var splash = document.getElementById('boot-splash');
        var msg = { fa: 'در حال بارگذاری…', en: 'Loading…', ar: 'جارٍ التحميل…' }[loc];
        document.addEventListener('DOMContentLoaded', function () {
          var p = document.querySelector('.boot-splash__text');
          if (p) p.textContent = msg;
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First-paint splash: replaced by React as soon as it mounts. -->
      <div id="boot-splash">
        <svg class="boot-splash__mark" viewBox="0 0 1210 1280" aria-hidden="true">
          <defs>
            <linearGradient id="boot-g" x1="0" y1="0" x2="0.25" y2="1">
              <stop offset="0%" stop-color="#F2660A" />
              <stop offset="45%" stop-color="#D8390C" />
              <stop offset="100%" stop-color="#8A0F0B" />
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#boot-g)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
            <path d="M92 148 H420" />
            <path d="M92 148 L405 548" />
            <path d="M512 296 L403 520" />
            <path d="M680 148 H1068" />
            <path d="M680 148 L214 1178" />
            <path d="M214 1178 H614" />
            <path d="M898 676 L762 958 L1158 1190" />
          </g>
        </svg>
        <p class="boot-splash__text">در حال بارگذاری…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
