    <style>
      /* Critical inline CSS — renders before the stylesheet arrives */
      html { background: #fbf6f5; }
      body { margin: 0; font-family: 'Vazirmatn Variable', 'Vazirmatn', Tahoma, sans-serif; }
      #boot-splash {
        /* Critical copies of the navigation-loader tokens. They are local so
           the first-paint screen is already identical before app CSS arrives. */
        --boot-surface: #ffffff;
        --boot-surface-raised: #ffffff;
        --boot-crimson: #dc143c;
        --boot-crimson-soft: rgba(220, 20, 60, .08);
        --boot-crimson-line: rgba(220, 20, 60, .2);
        --boot-crimson-ring: rgba(220, 20, 60, .15);
        --boot-line: rgba(27, 17, 20, .09);
        --boot-line-strong: rgba(27, 17, 20, .15);
        --boot-shadow: 0 6px 24px -12px rgba(27, 17, 20, .22);
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        padding: 24px;
        box-sizing: border-box;
        pointer-events: auto;
        touch-action: none;
        overscroll-behavior: contain;
        background: var(--boot-surface);
        transform: translate3d(0, 0, 0);
        transition: transform .48s cubic-bezier(.76, 0, .24, 1), visibility 0s .5s;
        will-change: transform;
        contain: paint;
      }
      /* Match the quiet glow behind the React navigation loader. */
      #boot-splash::before {
        content: '';
        position: absolute;
        width: min(72vw, 680px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, var(--boot-crimson-soft) 0 18%, transparent 68%);
        opacity: .72;
        pointer-events: none;
      }
      /* One clean sheet moves away after the route commits; the app and loader
         are never cross-faded as two full-screen layers. */
      #boot-splash.is-done {
        transform: translate3d(0, -101%, 0);
        visibility: hidden;
        pointer-events: none;
      }
      /* The stage, halo, orbit, two particles and raised logo disc deliberately
         mirror .navigation-loader__* in the application stylesheet. */
      .boot-splash__content {
        position: relative;
        width: clamp(148px, 19vw, 184px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        animation: boot-loader-stage-in .3s cubic-bezier(.16, 1, .3, 1) both;
        will-change: transform, opacity;
      }
      .boot-splash__halo {
        position: absolute;
        inset: 19%;
        border: 1px solid var(--boot-crimson-line);
        border-radius: 50%;
        background: var(--boot-crimson-soft);
        animation: boot-loader-breathe 1.9s cubic-bezier(.4, 0, .2, 1) infinite alternate;
        will-change: transform, opacity;
      }
      .boot-splash__orbit {
        position: absolute;
        inset: 2px;
        border: 1px solid var(--boot-line-strong);
        border-radius: 50%;
        animation: boot-loader-orbit 2.15s linear infinite;
        will-change: transform;
      }
      .boot-splash__orbit::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: conic-gradient(from 18deg, transparent 0 68%, var(--boot-crimson) 84%, transparent 96%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
      }
      .boot-splash__orbit > i {
        position: absolute;
        inset-block-start: -4px;
        inset-inline-start: calc(50% - 4px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--boot-crimson);
        box-shadow: 0 0 0 5px var(--boot-crimson-ring);
      }
      .boot-splash__orbit > i:last-child {
        inset-block-start: auto;
        inset-block-end: 17px;
        inset-inline-start: 15px;
        width: 5px;
        height: 5px;
        opacity: .52;
        box-shadow: none;
      }
      .boot-splash__mark {
        position: relative;
        z-index: 1;
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
        border: 1px solid var(--boot-line);
        border-radius: 50%;
        background: var(--boot-surface-raised);
        box-shadow: var(--boot-shadow);
      }
      .boot-splash__mark img {
        position: relative;
        height: 68px;
        width: auto;
        display: block;
        object-fit: contain;
        user-select: none;
      }
      /* Text remains available to assistive technology, but no copy competes
         with the mark on the visual loading screen. */
      .boot-splash__a11y {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      .boot-i18n > [lang] { display: none; }
      html[lang='fa'] .boot-i18n > [lang='fa'],
      html[lang='en'] .boot-i18n > [lang='en'],
      html[lang='ar'] .boot-i18n > [lang='ar'],
      html[lang='ru'] .boot-i18n > [lang='ru'] { display: inline; }
      @keyframes boot-loader-stage-in {
        from { opacity: 0; transform: scale(.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes boot-loader-orbit { to { transform: rotate(1turn); } }
      @keyframes boot-loader-breathe {
        from { opacity: .34; transform: scale(.94); }
        to { opacity: .82; transform: scale(1.04); }
      }
      html[data-theme='dark'] { background: #120a0d; }
      html[data-theme='dark'] #boot-splash {
        --boot-surface: #170e11;
        --boot-surface-raised: #21161a;
        --boot-crimson: #ef2b52;
        --boot-crimson-soft: rgba(239, 43, 82, .14);
        --boot-crimson-line: rgba(239, 43, 82, .3);
        --boot-crimson-ring: rgba(239, 43, 82, .24);
        --boot-line: rgba(246, 238, 240, .12);
        --boot-line-strong: rgba(246, 238, 240, .2);
        --boot-shadow: 0 6px 24px -12px rgba(0, 0, 0, .7);
      }
      html[data-theme='dark'] .boot-splash__mark img { filter: brightness(0) invert(1); }
      @media (max-width: 520px) {
        .boot-splash__content { width: 148px; }
        .boot-splash__mark { width: 94px; height: 94px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        #boot-splash.is-done { transform: none; visibility: hidden; }
        .boot-splash__content,
        .boot-splash__orbit,
        .boot-splash__halo { animation: none; }
        .boot-splash__orbit { transform: rotate(24deg); }
      }
    </style>

    <!-- Set language, direction and theme before the first paint so the page
         never flashes the wrong script direction or a white screen in dark
         mode. Mirrors the logic in src/i18n/LocaleContext.jsx. -->
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var loc = seg === 'en' || seg === 'ar' || seg === 'ru' ? seg : 'fa';
        var el = document.documentElement;
        el.lang = loc;
        el.dir = loc === 'en' || loc === 'ru' ? 'ltr' : 'rtl';
        var theme;
        try { theme = localStorage.getItem('ky_theme'); } catch (e) {}
        /* First visits always start light. Dark mode is an explicit preference,
           not an automatic copy of the operating-system setting. */
        if (theme !== 'dark' && theme !== 'light') theme = 'light';
        el.setAttribute('data-theme', theme);
        el.style.colorScheme = theme;
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) chrome.setAttribute('content', theme === 'dark' ? '#120a0d' : '#dc143c');
      })();
    </script>

        <span class="boot-splash__mark">
