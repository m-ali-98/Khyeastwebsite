<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#DC143C" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />

    <!-- Slow connections: start the two critical fetches before the JS bundle
         has even been parsed, and paint a branded screen instead of white. -->
    <link rel="preload" as="fetch" href="/api/content" crossorigin />
    <link rel="preload" as="image" href="/assets/img/hero-wheat.webp" fetchpriority="high" />
    <title>شرکت خمیر مایه خوزستان | از مغز گندم؛ تا اولین برش نان</title>
    <meta
      name="description"
      content="شرکت خمیر مایه خوزستان؛ تولیدکننده خمیرمایه خشک فوری با برندهای دزمایه، شتاب، ایکس پاور و نان مایه. بیش از سه دهه تجربه، صادرات به بیش از ۵۰ کشور جهان. از مغز گندم؛ تا اولین برش نان."
    />
    <meta property="og:title" content="شرکت خمیر مایه خوزستان" />
    <meta property="og:description" content="از مغز گندم؛ تا اولین برش نان — تولیدکننده خمیرمایه خشک فوری با بیش از سه دهه سابقه و صادرات به بیش از ۵۰ کشور" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <style>
      /* Critical inline CSS — renders before the stylesheet arrives */
      html { background: #fbf6f5; }
      body { margin: 0; font-family: 'Vazirmatn Variable', 'Vazirmatn', Tahoma, sans-serif; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-content: center;
        justify-items: center; gap: 22px; background: #fbf6f5; z-index: 9999;
        transition: opacity .25s ease, visibility .25s ease;
      }
      /* set by main.jsx once React has painted its first frame */
      #boot-splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      /* The splash covers the very first paint, when there is nothing else to
         look at, so it appears immediately. Everything AFTER boot is gated on
         connection speed instead — see src/hooks/useLoadingGate.js. */
      /* a soft crimson glow behind the mark, breathing out of phase with it:
         reads as "working" without a spinner competing with the logo */
      .boot-splash__mark {
        position: relative;
        display: grid;
        place-items: center;
        animation: boot-float 2.4s ease-in-out infinite alternate;
      }
      .boot-splash__mark::before {
        content: '';
        position: absolute;
        inset: -40px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(220, 20, 60, 0.34), transparent 68%);
        animation: boot-glow 2.4s ease-in-out infinite alternate;
      }
      .boot-splash__mark img { position: relative; width: 72px; height: auto; display: block; }
      .boot-splash__bar {
        width: 180px; height: 3px; border-radius: 999px;
        background: rgba(120, 80, 90, 0.16); overflow: hidden;
      }
      .boot-splash__bar span {
        display: block; width: 42%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #dc143c, transparent);
        animation: boot-sweep 1.25s ease-in-out infinite;
      }
      .boot-splash__text {
        margin: 0; color: #7c6a6e; font-size: 13.5px;
        animation: boot-fade 2.4s ease-in-out infinite alternate;
      }
      @keyframes boot-float { from { transform: translateY(3px); } to { transform: translateY(-3px); } }
      @keyframes boot-glow  { from { opacity: .16; transform: scale(.92); } to { opacity: .42; transform: scale(1.06); } }
      @keyframes boot-sweep { from { transform: translateX(-115%); } to { transform: translateX(275%); } }
      @keyframes boot-fade  { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark,
        .boot-splash__mark::before,
        .boot-splash__bar span,
        .boot-splash__text { animation: none; }
        .boot-splash__bar span { width: 100%; }
      }
      /* the artwork fades into the dark splash, so knock it out to white */
      html[data-theme='dark'] .boot-splash__mark img { filter: brightness(0) invert(1); }
      html[data-theme='dark'] .boot-splash__mark::before {
        background: radial-gradient(circle, rgba(239, 43, 82, 0.4), transparent 68%);
      }
      html[data-theme='dark'] .boot-splash__bar { background: rgba(255, 255, 255, 0.1); }
      html[data-theme='dark'] .boot-splash__bar span {
        background: linear-gradient(90deg, transparent, #ef2b52, transparent);
      }
      /* dark splash when dark mode is the active theme */
      html[data-theme='dark'] { background: #120a0d; }
      html[data-theme='dark'] #boot-splash { background: #120a0d; }
      html[data-theme='dark'] .boot-splash__text { color: #9d8e92; }
    </style>

    <!-- Set language, direction and theme before the first paint so the page
         never flashes the wrong script direction or a white screen in dark
         mode. Mirrors the logic in src/i18n/LocaleContext.jsx. -->
    <script>
      (function () {
        var seg = location.pathname.split('/')[1];
        var loc = seg === 'en' || seg === 'ar' ? seg : 'fa';
        var el = document.documentElement;
        el.lang = loc;
        el.dir = loc === 'en' ? 'ltr' : 'rtl';
        var theme;
        try { theme = localStorage.getItem('ky_theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        el.setAttribute('data-theme', theme);

        var splash = document.getElementById('boot-splash');
        var msg = { fa: 'در حال بارگذاری…', en: 'Loading…', ar: 'جارٍ التحميل…' }[loc];
        document.addEventListener('DOMContentLoaded', function () {
          var p = document.querySelector('.boot-splash__text');
          if (p) p.textContent = msg;
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First-paint splash: replaced by React as soon as it mounts. -->
      <div id="boot-splash">
        <div class="boot-splash__mark">
          <img src="/assets/brand/logo.png" alt="" aria-hidden="true" />
        </div>
        <div class="boot-splash__bar"><span></span></div>
        <p class="boot-splash__text">در حال بارگذاری…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
