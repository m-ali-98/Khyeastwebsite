<!-- Wraps the official raster mark so the tab icon is the real artwork rather
     than a redrawing of it. Replaced automatically by favicon.png if present. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <image href="/assets/brand/logo.png" xlink:href="/assets/brand/logo.png"
         x="9" y="6" width="46" height="52" preserveAspectRatio="xMidYMid meet"/>
</svg>
